name: Feature request
description: Suggest a tool or improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: Describe the task in Buttons you'd like an assistant to handle.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed tool or change
