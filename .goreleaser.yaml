version: 2
builds:
  - main: ./cmd/buttons-mcp
    binary: buttons-mcp
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, CHANGELOG.md]
checksum:
  name_template: checksums.txt
changelog:
  disable: true
